targets=child,clint.log,fixme.log,tests.log
cflags=-W -Wall -g -O2 -fPIC -D_FORTIFY_SOURCE=2 -fstack-protector
ldflags=-Wl,-z,relro -Wl,-z,now
dist=Makefile,clint.sh,fixme.sh

#targets
[child]
type=binary
sources=child.c

[clint.log]
type=script
script=./clint.sh
enabled=0
depends=clint.sh,$(OBJDIR)../src/daemonize$(EXEEXT)

[fixme.log]
type=script
script=./fixme.sh
enabled=0
depends=fixme.sh,$(OBJDIR)../src/daemonize$(EXEEXT)

[tests.log]
type=script
script=./tests.sh
enabled=0
depends=tests.sh,$(OBJDIR)../src/daemonize$(EXEEXT),$(OBJDIR)child
